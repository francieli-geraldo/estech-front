<div class="card card-custom gutter-b">
    <div class="card-body">

        <div class="row justify-content-center py-6 px-4 py-lg-6 px-lg-5">
            <div class="col-xl-12">
                <div class="d-flex justify-content-between border-bottom pb-5">
                    <div class="mr-2">
                        <div class="btn btn-light-primary font-weight-bold text-uppercase px-9 py-4"
                            (click)="destroyReport()" [hidden]="!isShowReport">
                            Voltar
                        </div>
                    </div>
                    <div>
                        <button [hidden]="isShowReport"
                            class="btn btn-success font-weight-bold text-uppercase px-9 py-4" (click)="generateReport()"
                            [disabled]="isDisabled">
                            Gerar Relatório
                        </button>

                        <div [hidden]="!isShowReport" ngbDropdown>
                            <a class="btn btn-success font-weight-bold text-uppercase px-9 py-4" id="dropdownExport"
                                ngbDropdownToggle>
                                Exportar
                                <i class="ki ki-arrow-down pl-2" style="font-size: .8em;"></i>
                            </a>
                            <div ngbDropdownMenu aria-labelledby="dropdownExport" class="px-9 py-4 font-weight-bold">
                                <button class="dropdown-item" (click)="exportAs('pdf', 'landscape')">PDF</button>
                                <button class="dropdown-item" (click)="exportAs('png')">Imagem</button>
                            </div>
                        </div>

                    </div>
                </div>
                <form class="form" id="kt_form" [formGroup]="reportForm">
                    <div class="pb-5">
                        <div [hidden]="isShowReport">
                            <div class="form-group m-0">
                                <div class="row pt-6">
                                    <!-- periodic -->
                                    <div class="col-lg-4">
                                        <label class="option">
                                            <span class="option-control">
                                                <span class="radio">
                                                    <input type="radio" value="periodic-reports"
                                                        formControlName="report" />
                                                    <span></span>
                                                </span>
                                            </span>
                                            <span class="option-label" style="cursor: pointer;">
                                                <span class="option-head">
                                                    <span class="option-title">
                                                        Periódico
                                                    </span>
                                                </span>
                                                <span class="option-body">
                                                    Relatório periódico dos lançamentos realizados.
                                                    <br>
                                                    <br>
                                                </span>
                                            </span>
                                        </label>
                                    </div>
                                    <!-- full -->
                                    <div class="col-lg-4">
                                        <label class="option">
                                            <span class="option-control">
                                                <span class="radio">

                                                    <input type="radio" value="full-report" formControlName="report" />
                                                    <span></span>
                                                </span>
                                            </span>
                                            <span class="option-label" style="cursor: pointer;">
                                                <span class="option-head">
                                                    <span class="option-title">
                                                        Evolução total
                                                    </span>
                                                </span>
                                                <span class="option-body">
                                                    Relatório com valores percentuaias de lançametos e evolução dos
                                                    pacientes no programa.
                                                </span>
                                            </span>
                                        </label>
                                    </div>
                                    <!-- completed -->
                                    <div class="col-lg-4">
                                        <label class="option">
                                            <span class="option-control">
                                                <span class="radio">
                                                    <input type="radio" value="completed-report"
                                                        formControlName="report" />
                                                    <span></span>
                                                </span>
                                            </span>
                                            <span class="option-label" style="cursor: pointer;">
                                                <span class="option-head">
                                                    <span class="option-title">
                                                        Concluídos
                                                    </span>
                                                </span>
                                                <span class="option-body">
                                                    Relatório com valores totais e percentuaias de lançamentos e
                                                    resultado alcançado pelos pacientes.
                                                </span>
                                            </span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="separator separator-dashed my-8"></div>

                            <label class="h5">
                                <i class="fa fa-filter" style="color: black; font-weight: 600;"></i>
                                Filtros
                            </label>
                            <div class="row">
                                <ng-container *ngIf="this.reportForm.value.report == 'periodic-reports'">
                                    <div class="col-lg-4">
                                        <label class="form-text text-muted"><b>Período</b></label>
                                        <date-period-input [inputMaxDate]="maxDate" [fcInitialDate]="'initialDate'"
                                            [fcFinalDate]="'finalDate'" [formGroupBase]="reportForm">
                                        </date-period-input>
                                    </div>
                                </ng-container>

                                <div class="col-lg-4">
                                    <label class="form-text text-muted"><b>Grupo</b></label>
                                    <select class="form-control" name="groupId" autocomplete="off" formControlName="groupId">
                                        <option *ngFor="let grupo of listGrupos$ | async" value="{{grupo.id}}">
                                            {{grupo.name}}
                                        </option>
                                    </select>
                                </div>

                                <ng-container
                                    *ngIf="this.reportForm.value.report == 'periodic-reports' || this.reportForm.value.report == 'full-report'">
                                    <div class="col-lg-4">
                                        <label class="form-text text-muted"><b>Situação</b></label>
                                        <select class="form-control" name="status" placeholder="Selecione"
                                            autocomplete="off" formControlName="status">
                                            <option value="" disabled selected>Selecione</option>
                                            <option value="ALL">Todos</option>
                                            <option value="ACTIVE">Ativo</option>
                                            <option value="CANCELED">Cancelado</option>
                                            <option value="COMPLETED">Concluído</option>
                                        </select>
                                    </div>
                                </ng-container>

                                <div 
                                [class.col-lg-12]="this.reportForm.value.report == 'periodic-reports'"
                                [class.col-lg-8]="this.reportForm.value.report == 'completed-report'"
                                [class.col-lg-4]="this.reportForm.value.report == 'full-report'"                                
                                >
                                    <label class="form-text text-muted"><b>Paciente</b></label>
                                    <input type="text" class="form-control" placeholder="Pesquisar"
                                        [ngbTypeahead]="search" [resultFormatter]="resultFormatBandListValue"
                                        [inputFormatter]="inputFormatBandListValue" formControlName="patientId" />
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <template #showReport></template>
            </div>
        </div>
    </div>
</div>
