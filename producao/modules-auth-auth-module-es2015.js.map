<!--begin::Signin-->
<div class="login-form login-signin">
  <ng-container *ngIf="hasErrorUnauthorized">
    <div
      class="mb-10 alert alert-custom alert-light-warning alert-dismissible"
    >
      <div class="alert-text">Token expirado, para sua segurança inicie um novo processo para redefinir sua senha.</div>
    </div>
  </ng-container>

  <ng-container *ngIf="hasResetSuccess">
    <div
      class="mb-10 alert alert-custom alert-light-success alert-dismissible"
    >
      <div class="alert-text">Senha redefinida com sucesso!</div>
    </div>
  </ng-container>

  <!--begin::Form-->
  <form class="form" [formGroup]="loginForm" novalidate="novalidate" id="kt_login_signin_form" (ngSubmit)="submit()">
    <!--begin::Title-->
    <div class="pb-13 pt-lg-0 pt-5">
      <h3 class="font-weight-bolder text-dark font-size-h4 font-size-h1-lg">
        Bem-vindo
      </h3>
    </div>
    <!--end::Title-->

    <!-- begin::Alert error-->
    <ng-container *ngIf="hasError">
      <div class="mb-10 alert alert-custom alert-light-danger alert-dismissible">
        <div class="alert-text">E-mail/Senha incorreto ou inválido.</div>
      </div>
    </ng-container>
    <!-- end::Alert error-->

    <!--begin::Form group-->
    <div class="form-group">
      <label class="font-size-h6 font-weight-bolder text-dark">E-mail</label>
      <input class="form-control form-control-solid h-auto py-7 px-6 rounded-lg" type="email" name="email"
        formControlName="email" autocomplete="off" />
    </div>
    <!--end::Form group-->

    <!--begin::Form group-->
    <div class="form-group">
      <div class="d-flex justify-content-between mt-n5">
        <label class="font-size-h6 font-weight-bolder text-dark pt-5">Senha</label>
      </div>

      <input class="form-control form-control-solid h-auto py-7 px-6 rounded-lg" type="password" name="password"
        autocomplete="off" formControlName="password" />
        
      <div class="d-flex justify-content-end mt-n5">        
        <a routerLink="/auth/recuperar-senha"
          class="text-primary font-size-h7 font-weight-bolder text-hover-primary pt-8" id="kt_login_forgot">
          Esqueceu a senha?
        </a>
      </div>
    </div>
    <!--end::Form group-->

    <!--begin::Action-->
    <div class="pb-lg-0 pb-5">
      <button 
        type="submit" 
        id="kt_login_signin_submit"
        class="btn btn-primary font-weight-bolder font-size-h6 px-8 py-4 my-3 mr-3" 
        [disabled]="loginForm.invalid">
        Entrar
      </button>

      <ng-container *ngIf="isLoading$ | async">
        <span class="spinner spinner-primary ml-5"></span>
      </ng-container>
    </div>
    <!--end::Action-->
  </form>
  <!--end::Form-->
</div>
<!--end::Signin-->

<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
    <div class="fv-plugins-message-container">
      <div class="fv-help-block">
        {{ message }}
      </div>
    </div>
  </ng-container>
</ng-template>
