
<div class="card card-custom card-stretch gutter-b">
  <div class="card-header border-0 pt-5">
    <h3 class="card-title font-weight-bolder">Lançamntos Diários - Por grupo</h3>
    <div class="card-toolbar">
      <div class="dropdown dropdown-inline" ngbDropdown placement="bottom-right" class="dropdown dropdown-inline"
        title="Quick actions">
        <a ngbDropdownToggle class="btn btn-clean btn-hover-light-primary btn-sm btn-icon cursor-pointer">
          <i class="ki ki-bold-more-hor"></i>
        </a>
        <div class="dropdown-menu dropdown-menu-sm dropdown-menu-right" ngbDropdownMenu>
          
        </div>
      </div>
    </div>
  </div>

  <div class="card-body d-flex flex-column">
    <div class="flex-grow-1 d-flex">
      <div class="col-lg-6">
        <div id="kt_mixed_widget_14_chart" style="height: '200px';">
          
          <apx-chart
          [series]="chartOptions.series"
          [chart]="chartOptions.chart"
          [dataLabels]="chartOptions.dataLabels"
          [plotOptions]="chartOptions.plotOptions"
          [xaxis]="chartOptions.xaxis"
          [stroke]="chartOptions.stroke"
          [legend]="chartOptions.legend"      
          [colors]="chartOptions.colors"
        ></apx-chart>
        </div>
      </div>

      <div class="linha-vertical"></div>

      <div class="col-lg-6">
        <div class="" style="display: inline-flex;width: 100%;">
          <label for="typeahead-focus" style="padding: 10px;">Grupo</label>
          <select class="form-control cursor-pointer" placeholder="Grupo" name="grupoId" formControlName="grupoId ">
            <!-- <option *ngFor="let register of gruposService.items$ | async" value="{{register.id}}">{{register.name}} -->
            <!-- </option> -->
          </select>
        </div>
        <app-dailies-table></app-dailies-table>
      </div>

    </div>
  </div>
</div>
