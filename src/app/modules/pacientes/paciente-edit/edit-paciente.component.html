<div class="card card-custom gutter-b">
  <ng-container *ngIf="isLoading$ | async">
    <div class="progress progress-modal">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar"
        style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
  </ng-container>

  <div class="card-header">
    <div class="card-title">
      <h3 class="card-label">
        <ng-container *ngIf="paciente">
          {{ id ? "Editar" : "Cadastrar" }} paciente
        </ng-container>
      </h3>
    </div>
    <div class="card-toolbar">
      <a type="button" class="btn btn-light" routerLink="/pacientes">
        <i class="fa fa-arrow-left"></i>Voltar
      </a>
      <button class="btn btn-secondary ml-2" (click)="reset()">
        <i class="fa fa-redo"></i>Redefinir
      </button>
    </div>
  </div>
  <div class="card-body">
    <ul class="nav nav-tabs nav-tabs-line" role="tablist">
      <li class="nav-item cursor-pointer" (click)="changeTab(tabs.INFOMACOES_PACIENTE_TAB)">
        <a class="nav-link" data-toggle="tab" role="tab"
          [attr.aria-selected]="activeTabId === tabs.INFOMACOES_PACIENTE_TAB"
          [class.active]="activeTabId === tabs.INFOMACOES_PACIENTE_TAB">
          Informações do Paciente
        </a>
      </li>
      <li class="nav-item cursor-pointer" (click)="changeTab(tabs.CONTRATOS_TAB)" *ngIf="id != 0">
        <a class="nav-link" data-toggle="tab" role="button" [attr.aria-selected]="activeTabId === tabs.CONTRATOS_TAB"
          [class.active]="activeTabId === tabs.CONTRATOS_TAB"> Contratos</a>
      </li>
      <li class="nav-item cursor-pointer" (click)="changeTab(tabs.LANCAMENTOS_TAB)" *ngIf="id != 0">
        <a class="nav-link" data-toggle="tab" role="tab" [attr.aria-selected]="activeTabId === tabs.LANCAMENTOS_TAB"
          [class.active]="activeTabId === tabs.LANCAMENTOS_TAB">Lançamentos diários</a>
      </li>
    </ul>

    <ng-container *ngIf="activeTabId === tabs.INFOMACOES_PACIENTE_TAB">
      <div class="mt-5" *ngIf="paciente">
        <form action="#" class="form form-label-right" [formGroup]="formGroup" (ngSubmit)="save()">
          <div class="form-group row">
            <div class="col-lg-12">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control form-control-lg form-control-solid" name="name" placeholder="Nome"
                autocomplete="off" [class.is-invalid]="isControlInvalid('name')"
                [class.is-valid]="isControlValid('name')" formControlName="name" />
            </div>
          </div>
          <div class="form-group row">
            <div class="col-lg-6">
              <label>Sexo</label>
              <select class="form-control form-control-lg form-control-solid" name="sex"
                [class.is-invalid]="isControlInvalid('sex')" formControlName="sex">
                <option value="MALE">Feminino</option>
                <option value="FEMALE">Masculino</option>
              </select>
            </div>
            <div class="col-lg-6">
              <label>Data de nascimento</label>
              <div class="input-group input-group-solid">
                <input type="date" 
                  name="birthDate" 
                  class="form-control form-control-lg form-control-solid"
                  
                  placeholder="dd/mm/yyyy" 
                  formControlName="birthDate"/>
              </div>
            </div>
          </div>

          <div class="form-group row">
            <div class="col-lg-6">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control form-control-lg form-control-solid" name="email"
                placeholder="E-mail" autocomplete="off" [class.is-invalid]="isControlInvalid('email')"
                [class.is-valid]="isControlValid('email')" formControlName="email" />
            </div>
            <div class="col-lg-6">
              <label class="form-label">Celular</label>
              <input type="text" class="form-control form-control-lg form-control-solid" name="phone"
                placeholder="Celular" autocomplete="off" [class.is-invalid]="isControlInvalid('phone')"
                [class.is-valid]="isControlValid('phone')" formControlName="phone" />
            </div>
          </div>

          <div class="float-right">
            <a class="btn btn-default font-weight-bold mr-2" routerLink="/pacientes">Cancelar</a>
            <button type="submit" class="btn btn-success font-weight-bold mr-2"
              [disabled]="formGroup.invalid">Salvar</button>
          </div>
        </form>
      </div>
    </ng-container>

    <ng-container *ngIf="id != 0 && activeTabId === tabs.CONTRATOS_TAB">
      <app-list-contratos [paciente]="paciente.id"></app-list-contratos>
    </ng-container>

    <ng-container *ngIf="id != 0 && activeTabId === tabs.LANCAMENTOS_TAB">
      <app-list-lancamentos [paciente]="paciente.id"></app-list-lancamentos>
    </ng-container>

  </div>
</div>
