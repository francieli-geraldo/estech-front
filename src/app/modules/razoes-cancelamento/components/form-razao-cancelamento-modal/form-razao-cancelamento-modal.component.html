<div class="modal-content">
    <div class="modal-header">
        <div class="modal-title h4" id="example-modal-sizes-title-lg">
            <ng-container *ngIf="register">
                <ng-container *ngIf="register.id">Editar</ng-container>
                <ng-container *ngIf="!register.id">Cadastrar</ng-container>
                razão cancelamento
                <ng-container *ngIf="register.id">'{{ register.reason }}'</ng-container>
            </ng-container>
        </div>
    </div>
    <div class="overlay overlay-block cursor-default modal-body" style="min-height: 404px">
        <ng-container *ngIf="isLoading$ | async">
            <div class="overlay-layer bg-transparent">
                <div class="spinner spinner-lg spinner-success"></div>
            </div>
        </ng-container>
        <ng-container *ngIf="register">
            <form action="#" class="form form-label-right" [formGroup]="formGroup">
                <div class="form-group row">
                    <div class="col-lg-8">
                        <label class="form-label">Razão</label>
                        <input type="text" class="form-control form-control-lg form-control-solid" name="reason"
                            placeholder="Razão" autocomplete="off" [class.is-invalid]="isControlInvalid('reason')"
                            [class.is-valid]="isControlValid('reason')" formControlName="reason" />
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col-lg-12">
                        <label class="form-label">Descrição</label>
                        <textarea rows="5" class="form-control form-control-lg form-control-solid" name="description"
                        placeholder="Descrição" autocomplete="off" [class.is-invalid]="isControlInvalid('description')"
                        [class.is-valid]="isControlValid('description')" formControlName="description"></textarea>
                    </div>
                </div>
            </form>
        </ng-container>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-light btn-elevate mr-2" (click)="modal.dismiss()">
            Cancelar
        </button>
        <ng-container *ngIf="register">
            <button type="submit" class="btn btn-primary btn-elevate" (click)="save()" [disabled]="formGroup.invalid">
                Salvar
            </button>
        </ng-container>
    </div> 
</div>
