<div class="modal-content">
    <div class="modal-header">
        <div class="modal-title h4" id="example-modal-sizes-title-lg">
            <ng-container *ngIf="register">
                <ng-container *ngIf="register.id">Alterar</ng-container>
                <ng-container *ngIf="!register.id">Novo</ng-container>
                programa
                <ng-container *ngIf="register.id">'{{ register.name }}'</ng-container>
            </ng-container>
        </div>
    </div>
    <div class="overlay overlay-block cursor-default modal-body" style="min-height: 200px">
        <ng-container *ngIf="isLoading$ | async">
            <div class="overlay-layer bg-transparent">
                <div class="spinner spinner-lg spinner-success"></div>
            </div>
        </ng-container>
        <ng-container *ngIf="register">
            <form action="#" class="form form-label-right" [formGroup]="formGroup">
                <div class="form-group row">
                    <div class="col-lg">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control form-control-lg form-control-solid" name="name"
                            placeholder="Nome do programa" autocomplete="off" [class.is-invalid]="isControlInvalid('name')"
                            [class.is-valid]="isControlValid('name')" formControlName="name" minlength="0" maxlength="60"/>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col-lg">
                        <label class="form-label">Descrição</label>
                        <textarea rows="2" class="form-control form-control-lg form-control-solid" name="description"
                        placeholder="Descrição sobre o programa" autocomplete="off" [class.is-invalid]="isControlInvalid('description')"
                        [class.is-valid]="isControlValid('description')" formControlName="description"  minlength="0" maxlength="255"></textarea>
                    </div>
                </div>
            </form>
        </ng-container>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-light btn-elevate mr-2" (click)="modal.dismiss()">
            Cancelar
        </button>
        <ng-container *ngIf="register">
            <button type="submit" class="btn btn-success btn-elevate" (click)="save()" [disabled]="formGroup.invalid">
                Salvar
            </button>
        </ng-container>
    </div> 
</div>
