<div class="row">        
    <ng-container *ngIf="result$ | async as _data">
        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Cooking/Kitchen-scale'"
                [title]="'KILOS PERDIDOS'"
                [baseColor]="'success'"
                [firstDescription]="_data['totalWeightMonth'] | maskWeight"
                [firstTooltip]="'No mês'"
                [secondDescription]="_data['totalWeight'] | maskWeight"
                [secondTooltip]="'No total'"
            ></app-card-default>
        </div> 
    
        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Code/Info-circle'"
                [title]="'LANÇAMENTOS'"
                [baseColor]="'warning'"
                [firstDescription]="(_data['totalReleasesWeek'] | maskWeight).replace(',000', '')"
                [firstTooltip]="'Na semana'"
                [secondDescription]="(_data['totalReleasesMonth'] | maskWeight).replace(',000', '')"
                [secondTooltip]="'No mês'"
                ></app-card-default>
        </div> 
    
        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Files/File-done'"
                [title]="'NOVOS CONTRATOS'"
                [baseColor]="'info'"
                [firstDescription]="(_data['totalNewContractsMonth'] | maskWeight).replace(',000', '')"
                [firstTooltip]="'No mês'"
                [secondDescription]="(_data['totalNewContracts'] | maskWeight).replace(',000', '')"    
                [secondTooltip]="'No total'"
                ></app-card-default>
        </div> 

        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Files/File-minus'"
                [title]="'CONTRATOS ENCERRADOS'"
                [baseColor]="'danger'"
                [firstDescription]="(_data['totalCompletedContractsMonth'] | maskWeight).replace(',000', '')"
                [firstTooltip]="'No mês'"
                [secondDescription]="(_data['totalCompletedContracts'] | maskWeight).replace(',000', '')"
                [secondTooltip]="'No total'"
                ></app-card-default>
        </div>
    </ng-container>
</div>
