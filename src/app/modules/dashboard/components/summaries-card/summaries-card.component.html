<div class="row">        
    <ng-container *ngIf="result$ | async as _data">
        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Cooking/Kitchen-scale'"
                [title]="'KILOS PERDIDOS'"
                [baseColor]="'success'"
                [firstDescription]="_data['totalWeightMonth']"
                [firstTooltip]="'Mês'"
                [secondDescription]="_data['totalWeight']"
                [secondTooltip]="'Total'"
            ></app-card-default>
        </div> 
    
        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Code/Info-circle'"
                [title]="'LANÇAMENTOS'"
                [baseColor]="'warning'"
                [firstDescription]="_data['totalReleasesWeek']"
                [firstTooltip]="'Semana'"
                [secondDescription]="_data['totalReleasesMonth']"
                [secondTooltip]="'Mês'"
                ></app-card-default>
        </div> 
    
        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Files/File-done'"
                [title]="'NOVOS CONTRATOS'"
                [baseColor]="'info'"
                [firstDescription]="_data['totalNewContractsMonth']"
                [firstTooltip]="'Mês'"
                [secondDescription]="_data['totalNewContracts']"    
                [secondTooltip]="'Total'"
                ></app-card-default>
        </div> 

        <div class="col-md-3 col-sm-6 col-6 ">
            <app-card-default
                [svg]="'Files/File-minus'"
                [title]="'CONTRATOS ENCERRADOS'"
                [baseColor]="'danger'"
                [firstDescription]="_data['totalCompletedContractsMonth']"
                [firstTooltip]="'Mês'"
                [secondDescription]="_data['totalCompletedContracts']"
                [secondTooltip]="'Total'"
                ></app-card-default>
        </div>
    </ng-container>
</div>
