<div class="card card-custom card-stretch gutter-b">
  <div class="card-header border-0 pt-5" style="justify-content: start;">
    <h3 class="card-title font-weight-bolder">Lançamntos Diários - Por grupo</h3>
    <div class="card-toolbar">
      <div ngbDropdown placement="bottom-right" class="dropdown dropdown-inline" title="Quick actions"
        style="padding-left: 15px;">
        <a ngbDropdownToggle class="btn btn-clean btn-hover-light-primary btn-sm btn-icon" data-toggle="dropdown"
          aria-haspopup="true" aria-expanded="false">
          <i class="ki ki-bold-more-hor"></i>
        </a>
        <div ngbDropdownMenu class="dropdown-menu dropdown-menu-md dropdown-menu-right">
          <app-dropdown-hide-table></app-dropdown-hide-table>
        </div>
      </div>
    </div>
    <div class="input-filter-group">
      <label for="typeahead-focus" style="padding-right: 10px;">Grupo:</label>
      <select class="form-control cursor-pointer" placeholder="Grupo" name="grupoId" formControlName="grupoId "
        style="min-width: 150px;">
        <!-- <option *ngFor="let register of gruposService.items$ | async" value="{{register.id}}">{{register.name}} -->
        <!-- </option> -->
      </select>
    </div>

  </div>

  <div class="card-body d-flex flex-column">
    <div class="flex-grow-1 d-flex container-chart">
      <div class="col-lg-6">
        <div id="kt_mixed_widget_14_chart">
          <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [dataLabels]="chartOptions.dataLabels"
            [plotOptions]="chartOptions.plotOptions" [xaxis]="chartOptions.xaxis" [stroke]="chartOptions.stroke"
            [legend]="chartOptions.legend" [colors]="chartOptions.colors"></apx-chart>
        </div>
      </div>

      <div class="linha-vertical"></div>

      <div class="col-lg-6">
        <app-dailies-table></app-dailies-table>
      </div>
    </div>
  </div>
</div>
