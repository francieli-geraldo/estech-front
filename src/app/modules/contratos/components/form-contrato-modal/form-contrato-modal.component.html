<div class="modal-content">
  <div class="modal-header">
    <div class="modal-title h4" id="example-modal-sizes-title-lg">
      <ng-container *ngIf="register">
        <ng-container *ngIf="register.id && isOpened(register.status)">Alterar</ng-container>
        <ng-container *ngIf="!register.id">Cadastrar</ng-container>    
        <ng-container *ngIf="register.status == 'COMPLETED' || register.status == 'CANCELED'">Visualizar</ng-container>        

        contrato
        <ng-container *ngIf="register.id">'{{ register.id }}'</ng-container>
      </ng-container>
    </div>
  </div>

  <div class="overlay overlay-block cursor-default modal-body" style="min-height: 404px">

    <ng-container *ngIf="isLoading$ | async">
      <div class="overlay-layer bg-transparent">
        <div class="spinner spinner-lg spinner-success"></div>
      </div>
    </ng-container>

    <ng-container *ngIf="register">

      <!-- EXIBINDO DADOS PACIENTE -->
      <div class="col-lg-12 pb-5" *ngIf="!!id">
        <label>Paciente</label>
        <div class="input-group input-group-solid">
          <div class="form-control form-control-lg form-control-solid">
            {{ register?.patient?.name || "*" }} - {{ register?.patient?.phone || "*" }}
          </div>
        </div>
      </div>

      <div class="form-group" *ngIf="!id">
        <div class="col-lg-12">
          <label>Paciente</label>
          <div class="input-group input-group-solid">
            <input type="text" class="form-control form-control-lg form-control-solid" placeholder="Pesquisar"
              [ngbTypeahead]="search" [resultFormatter]="resultFormatBandListValue"
              [inputFormatter]="inputFormatBandListValue" [(ngModel)]="pacienteIdContrato" />
          </div>
        </div>
      </div>


      <!-- FORM CONTRATO-->
      <form action="#" class="form form-label-right" [formGroup]="formContrato">
        <div class="col-lg-12">

          <div class="form-group row">
            <div class="col-lg-6">
              <label>Data de início</label>
              <div class="input-group input-group-solid">
                <input type="date" name="startDate" class="form-control form-control-lg form-control-solid"
                    placeholder="dd/mm/yyyy" formControlName="startDate" />                    
              </div>
            </div>

            <div class="col-lg-6">
              <label>Data de conclusão</label>
              <div class="input-group input-group-solid">
                <input type="date" name="hiringDate" class="form-control form-control-lg form-control-solid"
                    placeholder="dd/mm/yyyy" formControlName="hiringDate" />
              </div>
            </div>
          </div>

          <div class="form-group row">
            <div class="col-lg-6">
              <label>Programa</label>
              <select class="form-control form-control-lg form-control-solid" formControlName="programId">
                <option value="0" disabled>Selecione</option>
                <option *ngFor="let register of listProgramas$ | async" value="{{register.id}}">
                  {{register.name}}
                </option>
              </select>
            </div>

            <div class="col-lg-6">
              <label>Grupo</label>
              <select class="form-control form-control-lg form-control-solid" formControlName="groupId">
                <option value="0" disabled>Selecione</option>
                <option *ngFor="let register of listGrupos$ | async" value="{{register.id}}">{{register.name}}
                </option>
              </select>
            </div>
          </div>

          <div class="form-group row">
            <div class="col-lg-4">
              <label class="form-label">Peso Inícial</label>
              <input type="number" max="600" step=",001" class="form-control form-control-lg form-control-solid"
                [class.is-invalid]="isControlInvalid('startingWeight')"
                [class.is-valid]="isControlValid('startingWeight')" placeholder="Peso Inícial" autocomplete="off"
                formControlName="startingWeight" name="startingWeight" (blur)="changeWeight($event)" />
            </div>

            <div class="col-lg-4">
              <label class="form-label">Meta</label>

              <input type="number" max="600" step=",001" class="form-control form-control-lg form-control-solid"
                [class.is-invalid]="isControlInvalid('goal')" [class.is-valid]="isControlValid('goal')"
                placeholder="Meta" autocomplete="off" formControlName="goal" name="goal"
                (blur)="changeWeight($event)" />
            </div>

            <div class="col-lg-4">
              <label class="form-label">Objetivo</label>
              <input type="number" class="form-control form-control-lg form-control-solid" name="objetivo"
                placeholder="Objetivo" autocomplete="off" formControlName="objetivo" value="{{sumObjetivo()}}"
                disabled />
            </div>
          </div>

          <div class="form-group row">
            <div class="col-lg-12">
              <label class="form-label">Observação</label>
              <textarea type="text" class="form-control form-control-lg form-control-solid" name="notes"
                placeholder="Observação" autocomplete="off" [class.is-invalid]="isControlInvalid('notes')"
                [class.is-valid]="isControlValid('notes')" formControlName="notes"></textarea>
            </div>
          </div>
        </div>

      </form>

      <ng-container *ngIf="register.status == 'COMPLETED' || register.status == 'CANCELED'">        
        <hr>
        <div class="row col-lg-12">
          <div class="col-lg-6 pb-5" *ngIf="!!id">
            <label>Status</label>
            <div class="input-group input-group-solid">
              <div class="form-control form-control-lg form-control-solid">
                <ng-container *ngIf="register.status == 'COMPLETED'">
                  Concluído
                </ng-container>
                <ng-container *ngIf="register.status == 'CANCELED'">        
                  Cancelado
                </ng-container>
              </div>
            </div>
          </div>
          
          <ng-container *ngIf="register.status == 'COMPLETED'">
            <div class="col-lg-6 pb-5" *ngIf="!!id">
              <label>Data de conclusão </label>
              <div class="input-group input-group-solid">
                <div class="form-control form-control-lg form-control-solid">
                  {{ register.dateConclusion | date:'dd/MM/yyyy' }}
                </div>
              </div>
            </div>
          </ng-container>
          
          <ng-container *ngIf="register.status == 'CANCELED'">
            <div class="col-lg-6 pb-5" *ngIf="!!id">
              <label>Data de cancelamento</label>
              <div class="input-group input-group-solid">
                <div class="form-control form-control-lg form-control-solid">
                  {{ register.cancellationDate | date:'dd/MM/yyyy' }}
                </div>
              </div>
            </div>
          </ng-container>
        </div>


        <ng-container *ngIf="register.status == 'CANCELED'">
          <div class="col-lg-12 pb-5" *ngIf="!!id">
            <label>Motivo do cancelamento </label>
            <div class="input-group input-group-solid">
              <div class="form-control form-control-lg form-control-solid">
                {{ register.reasonCancellation || '*' }}
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>

      
    </ng-container>
  </div>

  <div class="modal-footer">
    <ng-container *ngIf="register && isOpened(register.status)">
      <button type="submit" class="btn btn-success btn-elevate" (click)="save()" [disabled]="formContrato.invalid">
        Salvar
      </button>
    </ng-container>

    <button type="button" class="btn btn-light btn-elevate mr-2" (click)="modal.dismiss()">
      Fechar
    </button>
  </div>
</div>
