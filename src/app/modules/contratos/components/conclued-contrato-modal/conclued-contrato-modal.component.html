<ng-container *ngIf="isLoading">
    <div class="progress progress-modal">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar"
        style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
  </ng-container>
  
  <div class="modal-header">
    <div class="modal-title h4">Cancelar contrato | {{ nomeCliente }}</div>
  </div>
  <div class="modal-body">
    <ng-container *ngIf="isLoading">
      <span>Contrato está sendo cancelado...</span>
    </ng-container>
  
    <ng-container *ngIf="!isLoading">
      <span>Tem certeza de que deseja <b>cancelar</b> este contrato permanentemente?</span>    
    </ng-container>

    <ng-container *ngIf="isEditable">
      <input type="date" name="startDate" class="form-control form-control-lg form-control-solid"
        placeholder="dd/mm/yyyy" max="{{currentDate|date:'yyyy-MM-dd'}}" [(ngModel)]="cancellationDate" (ngModelChange)="onChange($event)"/>

      <textarea type="text" class="form-control form-control-lg form-control-solid mt-5"  [(ngModel)]="reasonCancellation"
          placeholder="Motivo do cancelamento" autocomplete="off" ></textarea>      
    </ng-container>
  </div>
  
  <div class="modal-footer">
    <div>
      <button type="button" class="btn btn-light btn-elevate mr-1" (click)="modal.dismiss()">
        Não
      </button>&nbsp;
      
      <ng-container *ngIf="!isEditable">
        <button type="button" class="btn btn-primary btn-elevate" (click)="showFieldObservacao()">
          Sim
        </button>        
      </ng-container>
            
      <ng-container *ngIf="isEditable">
        <button type="button" class="btn btn-primary btn-elevate" (click)="cancel()" [disabled]="isDisabled">
          Salvar
        </button>        
      </ng-container>
    </div>
  </div>
