<div class="modal-header">
  <div class="modal-title h4">Reativar contrato | {{ nomeCliente }}</div>
</div>
<div class="modal-body">  
  <span>Tem certeza de que deseja <b>reativar</b> este contrato?</span>
</div>

<div class="modal-footer">
  <div>
    <button type="button" class="btn btn-light btn-elevate mr-1" (click)="modal.dismiss()">
      Não
    </button>&nbsp;
    
    <button type="button" class="btn btn-primary btn-elevate" (click)="reactivate()">
      Sim
    </button>
  </div>
</div>
